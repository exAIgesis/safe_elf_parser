name: SPARK verify

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  gnatprove:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup alire
        uses: alire-project/setup-alire@v3

      - name: debug location
        run: |
          pwd
          ls -la
          find . -name alire.toml
      
      - name: Install gnatprove
        run: alr -n with gnatprove

      - name: Run gnatprove
        run: alr -n gnatprove -j0 --level=2 --checks-as-errors=on --mode="gold"
